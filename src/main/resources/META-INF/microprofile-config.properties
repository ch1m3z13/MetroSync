# Application
app.name=CommuteNG
app.version=1.0.0
app.country=NG
app.currency=NGN
app.timezone=Africa/Lagos

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.minutes=60
jwt.refresh.expiration.days=30

# Paystack
paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.public.key=${PAYSTACK_PUBLIC_KEY}

# Termii
termii.api.key=${TERMII_API_KEY}
termii.sender.id=CommuteNG
termii.channel=generic

# File Storage
file.storage.type=s3
file.storage.local.path=./uploads
file.storage.max.size=10485760

# AWS S3
aws.s3.bucket.name=${S3_BUCKET_NAME}
aws.s3.region=eu-north-1
aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}

# Business Rules
pricing.base.fare=200
pricing.per.km=50
pricing.minimum.fare=150
pricing.commission.rate=0.15

# Limits
wallet.daily.transaction.limit=100000
wallet.daily.withdrawal.limit=50000

# OTP
otp.expiry.minutes=10
otp.max.attempts=3