version: '3.8'

services:
  # PostgreSQL + PostGIS (Backend Database)
  db:
    image: postgis/postgis:16-3.4
    container_name: metrosync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: commuter_network
      POSTGRES_USER: commuter_user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commuter_user -d commuter_network"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - metrosync-network

  # Nominatim (Self-Hosted Geocoding Server)
  # Uses Nigeria-only OSM data for fast performance
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: metrosync-nominatim
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Nigeria extract (only ~150MB vs 70GB for full planet)
      PBF_URL: https://download.geofabrik.de/africa/nigeria-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/africa/nigeria-updates/
      
      # Performance optimizations
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
      IMPORT_GB_POSTCODES: "false"
      THREADS: 4
      
      # Security
      NOMINATIM_PASSWORD: nominatim_secret
      
      # Storage
      NOMINATIM_FLATNODE_FILE: /nominatim/flatnode/flatnode.file
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main
      - nominatim-flatnode:/nominatim/flatnode
    shm_size: 2gb
    networks:
      - metrosync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/search?q=Abuja&format=json"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2h # Nominatim takes 10-30 minutes to import Nigeria data

  # MetroSync Backend
  metrosync-server:
    build: .
    container_name: metrosync-server
    depends_on:
      db:
        condition: service_healthy
      nominatim:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/commuter_network
      NOMINATIM_BASE_URL: http://nominatim:8080
    restart: unless-stopped
    networks:
      - metrosync-network

volumes:
  db-data:
  nominatim-data:
  nominatim-flatnode:

networks:
  metrosync-network:
    driver: bridge