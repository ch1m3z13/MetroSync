services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=${DB_JDBC_URL}
      - QUARKUS_DATASOURCE_USERNAME=${DB_USERNAME}
      - QUARKUS_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - metro-net
    restart: unless-stopped

  db:
    # merged: using postgis as requested, version 15-3.3 from your new config
    image: postgis/postgis:15-3.3
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - metro-net
    # merged: healthcheck from old file, updated with new credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metro -d metrosync"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:

networks:
  metro-net: